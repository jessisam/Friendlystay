version: '3.8'

services:
  # Laravel PHP-FPM Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: friendlystay_backend
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: backend
      SERVICE_TAGS: dev
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:-mysql.hostinger.com}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-u123456789_friendlystay}
      DB_USERNAME: ${DB_USERNAME:-u123456789_user}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - .:/var/www
      - /var/www/vendor
    networks:
      - friendlystay_net

  # Nginx Webserver Service
  web:
    image: nginx:alpine
    container_name: friendlystay_nginx
    restart: unless-stopped
    tty: true
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - friendlystay_net
    depends_on:
      - backend

networks:
  friendlystay_net:
    driver: bridge
