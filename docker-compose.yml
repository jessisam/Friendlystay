version: '3.8'

services:
  # Laravel PHP-FPM Service
  backend:
    build:
      context: ./friendlystay-laravel
      dockerfile: Dockerfile
    container_name: friendlystay_backend
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: backend
      SERVICE_TAGS: dev
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY:-base64:7K5V/YJ0S5K43F24xR8z7P/vH5H3Y4X5Z6W7E8R9T0Y=}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: ${DB_CONNECTION:-sqlite}
      DB_DATABASE: ${DB_DATABASE:-/var/www/database/database.sqlite}
      JWT_SECRET: ${JWT_SECRET:-friendlystay_secret_key_2024_secure_prod_token}
    volumes:
      - ./friendlystay-laravel:/var/www
      - /var/www/vendor
    networks:
      - friendlystay_net

  # Nginx Webserver for Laravel Backend API
  backend-web:
    image: nginx:alpine
    container_name: friendlystay_backend_web
    restart: unless-stopped
    tty: true
    ports:
      - "8000:80"
    volumes:
      - ./friendlystay-laravel:/var/www
      - ./friendlystay-laravel/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - friendlystay_net
    depends_on:
      - backend

  # React Frontend Container
  frontend:
    build:
      context: ./friendlystay-react
      dockerfile: Dockerfile
    container_name: friendlystay_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - friendlystay_net
    depends_on:
      - backend-web

networks:
  friendlystay_net:
    driver: bridge
